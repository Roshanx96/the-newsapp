
apiVersion: apps/v1
kind: Deployment
metadata:
  name: random-app
  namespace: default
  labels:
    app: random-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: random-app
  template:
    metadata:
      labels:
        app: random-app
    spec:
      containers:
        - name: nginx-container
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: random-app-service
spec:
  type: NodePort
  selector:
    app: random-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080