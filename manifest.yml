
apiVersion: apps/v1
kind: Deployment
metadata:
  name: random-app-service
  namespace: default
  labels:
    app: random-app-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: random-app-service
  template:
    metadata:
      labels:
        app: random-app-service
    spec:
      containers:
        - name: nginx-container
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "10000m"
              memory: "12800Mi"
            limits:
              cpu: "50000m"
              memory: "25676Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 800
            initialDelaySeconds: 100
            periodSeconds: 100

          readinessProbe:
            httpGet:
              path: /
              port: 800
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: random-app-service
spec:
  type: NodePort
  selector:
    app: random-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080000